[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
sib-core = { path = "crates/sib-core" }
sib-transport = { path = "crates/sib-transport" }
sib-alerts = { path = "crates/sib-alerts" }
sib-config = { path = "crates/sib-config" }
sib-modules = { path = "crates/sib-modules" }
sib-engine = { path = "crates/sib-engine" }
sib-storage = { path = "crates/sib-storage" }
sib-docgen = { path = "crates/sib-docgen" }
sib-incidents = { path = "crates/sib-incidents" }
sib-ai = { path = "crates/sib-ai" }
sib-ui = { path = "crates/sib-ui" }

tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util", "net"] }
async-trait = "0.1"
russh = "0.63"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6.0"
keyring = "4.2"
notify-rust = "4.18.0"
regex = "1.13.1"
ureq = { version = "3.4.2", features = ["json"] }
walkers = "0.59.0"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1.0"
egui_plot = "0.37"
egui_extras = "0.36"
ssh2-config = "0.8"
chrono = { version = "0.4", features = ["serde"] }
eframe = "0.36"
egui = "0.36"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
